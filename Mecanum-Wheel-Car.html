<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麥克納姆輪小車組裝任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: sticker-book workbench — chunky ink outlines, offset shadows, one bright color per mission */
:root{
  --bg:#e6f4ff; --dot:#c4e3ff; --card:#ffffff; --ink:#1d1a4d; --muted:#57527f; --line:#1d1a4d;
  --soft:#f3f0ff;
  --yellow:#ffd23f; --yellow-ink:#1d1a4d;
  --wa:#b8f2d0; --wa-ink:#0b7a43; --wb:#ffcbe6; --wb-ink:#b3186c;
  --blue:#2f7bff; --ok:#14a35b; --bad:#ff3b5c;
  --c0:#ff7a1a; --c1:#2f7bff; --c2:#14b86a; --c3:#ff4fa3; --c4:#8b5cf6; --c5:#ffb800;
  --shadow:4px 4px 0 var(--ink);
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:56px;height:56px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;flex:none;border:3px solid var(--line);box-shadow:var(--shadow);transform:rotate(-6deg)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 2px;color:var(--ink)}
.sub{color:var(--muted);font-size:15px;margin:0}
.prog{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;box-shadow:var(--shadow)}
.bar{width:150px;height:14px;border-radius:99px;background:var(--soft);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--c2) 0 8px,var(--c5) 8px 16px);transition:width .5s cubic-bezier(.3,1.4,.6,1)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 10px 2px;scrollbar-width:thin}
.chip{--c:var(--c1);flex:none;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px 6px 6px;font-family:var(--body);font-weight:500;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:46px;box-shadow:3px 3px 0 var(--line);transition:transform .15s}
.chip b{font-family:var(--mono);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:2px solid var(--line)}
.chip:hover{transform:translateY(-2px)}
.chip.done b{background:var(--ok)}
.chip.on{background:var(--c);color:#fff}
.chip.on b{background:#fff;color:var(--c)}
.card{--c:var(--c1);background:var(--card);border-radius:24px;padding:clamp(18px,3.5vw,34px);border:3px solid var(--line);box-shadow:7px 7px 0 var(--c);display:flex;flex-direction:column;gap:18px;position:relative}
.eyebrow{align-self:flex-start;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.08em;color:#fff;background:var(--c);border:2px solid var(--line);border-radius:10px;padding:3px 12px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--line)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.8vw,38px);margin:0;line-height:1.25;text-wrap:balance}
p{margin:0;max-width:62ch}
p strong,p b{color:var(--c);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.grid2>*{min-width:0}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure img{border-radius:16px;width:100%;display:block;border:3px solid var(--line);background:#fff;box-shadow:var(--shadow)}
figcaption{font-size:14px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft);border:3px solid var(--line);cursor:pointer;min-height:54px;transition:transform .15s,background .2s}
.checks label:hover{transform:translateX(3px)}
.checks input{width:28px;height:28px;flex:none;accent-color:var(--ok);margin:1px 0 0}
.checks label:has(input:checked){background:var(--wa);color:var(--wa-ink)}
.checks label:has(input:checked) span{text-decoration:line-through;text-decoration-thickness:2px}
.tip{border-radius:16px;padding:12px 16px;background:#fff6cc;color:#3a2f00;border:3px solid var(--line);font-size:16px;position:relative}
.tip.warn{background:#ffe0e5;color:#5c0d1c}
.tip strong{font-family:var(--display);font-weight:400;font-size:18px}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:20px;border-radius:16px;padding:12px 26px;cursor:pointer;min-height:56px;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.go{background:var(--yellow);color:var(--yellow-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.chip:focus-visible,.slot:focus-visible,.pick:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.need{font-size:15px;color:var(--ink);align-self:center;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:4px 12px}
.need:empty{display:none}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mat{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;background:var(--soft);border:3px solid var(--line);cursor:pointer;transition:transform .15s}
.mat:nth-child(odd){transform:rotate(-.8deg)} .mat:nth-child(even){transform:rotate(.8deg)}
.mat:hover{transform:rotate(0) scale(1.02)}
.mat img{border-radius:12px;aspect-ratio:16/10;object-fit:cover;width:100%;background:#fff;border:2px solid var(--line)}
.mat .ph{aspect-ratio:16/10;border-radius:12px;display:grid;place-items:center;background:var(--card);border:3px dashed var(--muted);color:var(--muted);font-family:var(--display);font-size:20px}
.mat .row{display:flex;gap:10px;align-items:center}
.mat input{width:26px;height:26px;accent-color:var(--ok);flex:none}
.mat:has(input:checked){background:var(--wa);color:var(--wa-ink)}
.qty{font-family:var(--mono);font-weight:800;font-size:13px;background:var(--c);color:#fff;border-radius:8px;padding:1px 8px;margin-left:auto;border:2px solid var(--line)}
.stage{display:flex;justify-content:center;background:var(--soft);border:3px solid var(--line);border-radius:20px;padding:10px;width:100%}
.stage svg{width:100%;max-width:380px;height:auto;touch-action:manipulation}
.slot{cursor:pointer}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:99px;padding:4px 14px;font-size:15px;font-weight:700;border:2px solid var(--line)}
.pill.a{background:var(--wa);color:var(--wa-ink)}
.pill.b{background:var(--wb);color:var(--wb-ink)}
.msg{font-family:var(--display);font-size:22px;min-height:34px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.msg.ok::before{content:"★ "}
.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 12px;font-family:var(--body);font-weight:500;font-size:16px;cursor:pointer;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:3px 3px 0 var(--line)}
.pick.sel{background:var(--c1);color:#fff}
.pick.sel .tag{color:#fff}
.pick.wired{background:var(--wa);color:var(--wa-ink)}
.pick .tag{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--muted)}
.pick.wired .tag{color:var(--wa-ink)}
.quiz{display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--soft);border:3px solid var(--line)}
.q .opts{display:flex;flex-wrap:wrap;gap:10px}
.q button{font-family:var(--display);font-size:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 20px;min-height:50px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.q button.right{background:var(--ok);color:#fff}
.q button.wrong{background:var(--bad);color:#fff}
.cert{border:4px dashed var(--line);background:repeating-linear-gradient(45deg,#fff6cc 0 18px,#ffeaa0 18px 36px);color:#1d1a4d;border-radius:24px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.cert .eyebrow{align-self:center;background:var(--c3)}
.cert .big{font-family:var(--display);font-size:clamp(28px,5.5vw,42px)}
.cert p{color:#1d1a4d}
.cert input{font-family:var(--display);font-size:24px;text-align:center;border:3px solid #1d1a4d;border-radius:14px;background:#fff;color:#1d1a4d;padding:6px 12px;width:min(320px,100%)}
.cert input:focus{outline:4px solid var(--c3)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:.3}to{transform:none;opacity:1}}
.party{position:relative;margin:-6px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 18%,#fff6cc 0,#ffe3f1 45%,#dff0ff 100%);color:#1d1a4d}
.party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.party-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:28px 12px}
.trophy{animation:bounce 1.6s ease-in-out infinite}
.party-title{font-size:clamp(32px,7vw,54px);color:#1d1a4d}
.party-sub{font-size:19px;color:#57527f}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.badge{background:var(--c);color:#fff;font-weight:700;border:3px solid #1d1a4d;border-radius:99px;padding:6px 16px;box-shadow:3px 3px 0 #1d1a4d;font-size:16px}
.badge:nth-child(odd){transform:rotate(-3deg)}.badge:nth-child(even){transform:rotate(3deg)}
.party .cert{width:min(560px,100%)}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.mono{font-family:var(--mono)}
.foot{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

[hidden]{display:none!important} img{max-width:100%}
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 30 30"><rect x="6" y="4" width="18" height="22" rx="4" fill="none" stroke="#1b2440" stroke-width="2.4"/><rect x="1" y="5" width="5" height="8" rx="1.5" fill="#1b2440"/><rect x="24" y="5" width="5" height="8" rx="1.5" fill="#1b2440"/><rect x="1" y="17" width="5" height="8" rx="1.5" fill="#1b2440"/><rect x="24" y="17" width="5" height="8" rx="1.5" fill="#1b2440"/></svg>
      </div>
      <div style="min-width:0">
        <h1>麥克納姆輪小車<span class="hl">組裝任務</span></h1>
        <p class="sub">micro:bit × Super:bit 2.0｜一步一步完成，每關打勾才能前進</p>
      </div>
    </div>
    <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt">0/10</span></div>
  </header>

  <nav class="rail" id="rail" aria-label="組裝關卡"></nav>
  <main class="card" id="stage" aria-live="polite"></main>
  <div class="nav">
    <button class="btn" id="prevBtn" type="button">← 上一步</button>
    <span class="need" id="needTxt"></span>
    <button class="btn go" id="nextBtn" type="button">下一步 →</button>
  </div>
  <p class="foot">臺北市立陽明高中｜陳政川老師 micro:bit 麥克納姆輪小車 DIY 課程・互動組裝練習</p>
</div>

function checklist(id,items){
  return `<ul class="checks">${items.map((t,i)=>{const k=id+"_"+i;return `<li><label><input type="checkbox" id="${k}" data-ck="${k}" ${S.checks[k]?"checked":""}><span>${t}</span></label></li>`}).join("")}</ul>`;
}
function allChecked(id,n){for(let i=0;i<n;i++)if(!S.checks[id+"_"+i])return false;return true}

/* ---------- wheel drawing ---------- */
function rollers(x,y,w,h,type,id){
  // A = "/" , B = "\" (viewed from above)
  let s=`<clipPath id="c${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/></clipPath><g clip-path="url(#c${id})" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" opacity=".75">`;
  for(let k=-w;k<h+w;k+=20){
    if(type==="A") s+=`<line x1="${x}" y1="${y+k+w}" x2="${x+w}" y2="${y+k}"/>`;
    else s+=`<line x1="${x}" y1="${y+k}" x2="${x+w}" y2="${y+k+w}"/>`;
  }
  return s+"</g>";
}
const WBOX={LF:[22,48],RF:[233,48],LB:[22,222],RB:[233,222]};
function carSVG(mode){
  const W=45,H=92;
  let s=`<svg viewBox="0 0 300 370" role="img" aria-label="小車俯視圖">
  <text x="150" y="20" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="var(--body)">▲ 車頭（前）</text>
  <rect x="70" y="32" width="160" height="300" rx="70" fill="var(--yellow)" fill-opacity=".35" stroke="var(--ink)" stroke-width="3"/>
  <rect x="112" y="70" width="76" height="52" rx="6" fill="#222" /><rect x="126" y="80" width="48" height="32" rx="2" fill="none" stroke="#f6c21c" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">micro:bit</text>
  <rect x="98" y="158" width="104" height="96" rx="8" fill="var(--card)" stroke="var(--muted)" stroke-width="3"/>
  <text x="150" y="203" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="var(--mono)">Super:bit</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--body)">控制板</text>`;
  if(mode==="ports"){
    const P={M1:[74,172],M2:[74,214],M3:[188,172],M4:[188,214]};
    for(const m in P){const [x,y]=P[m];const used=Object.values(S.ports).includes(m);
      s+=`<g class="slot" data-port="${m}" tabindex="0" role="button" aria-label="${m} 接口"><rect x="${x}" y="${y}" width="38" height="30" rx="5" fill="${used?"var(--ok)":"var(--card)"}" stroke="var(--ink)" stroke-width="2.5"/><text x="${x+19}" y="${y+20}" text-anchor="middle" font-size="13" font-weight="800" fill="${used?"#fff":"var(--ink)"}" font-family="var(--mono)">${m}</text></g>`;}
    for(const p in S.ports){const [wx,wy]=WBOX[p];const [px,py]=P[S.ports[p]];
      const cx=wx+W/2,cy=wy+H/2,tx=px+19,ty=py+15;
      s+=`<path d="M${cx} ${cy} C ${cx} ${(cy+ty)/2}, ${tx} ${(cy+ty)/2}, ${tx} ${ty}" fill="none" stroke="${S.ports[p]===ANS_PORT[p]?"var(--ok)":"var(--bad)"}" stroke-width="3" stroke-dasharray="6 4"/>`;}
  }
  for(const p in WBOX){
    const [x,y]=WBOX[p];const t=mode==="wheels"?S.wheels[p]:ANS_WHEEL[p];
    const fill=t==="A"?"var(--wa)":t==="B"?"var(--wb)":"var(--card)";
    const isSel=mode==="ports"&&pickSel===p;
    s+=`<g class="${mode==="wheels"||mode==="ports"?"slot":""}" data-w="${p}" tabindex="${mode==="wheels"||mode==="ports"?0:-1}" role="button" aria-label="${POS[p]}輪 ${t||"空"}">
      <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10" fill="${fill}" stroke="${isSel?"var(--blue)":"var(--muted)"}" stroke-width="${isSel?5:3}" ${t?"":'stroke-dasharray="6 5"'}/>`;
    if(t) s+=rollers(x,y,W,H,t,p+mode)+`<text x="${x+W/2}" y="${y+H/2+9}" text-anchor="middle" font-size="26" font-family="var(--mono)" font-weight="800" fill="${t==="A"?"var(--wa-ink)":"var(--wb-ink)"}" stroke="var(--card)" stroke-width="5" paint-order="stroke">${t}</text>`;
    else s+=`<text x="${x+W/2}" y="${y+H/2+6}" text-anchor="middle" font-size="16" fill="var(--muted)" font-family="var(--body)">點我</text>`;
    s+=`<text x="${x+W/2}" y="${y+H+18}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--body)">${POS[p]}</text></g>`;
  }
  return s+"</svg>";
}
function wheelIcon(t){
  return `<svg viewBox="0 0 60 110" width="54" aria-hidden="true"><rect x="7" y="7" width="46" height="96" rx="10" fill="${t==="A"?"var(--wa)":"var(--wb)"}" stroke="var(--muted)" stroke-width="3"/>${rollers(7,7,46,96,t,"ic"+t+Math.random().toString(36).slice(2,6))}</svg>`;
}

/* ---------- chassis screw diagram ---------- */
function chassisSVG(){
  const C={LF:[40,60],RF:[220,60],LB:[40,220],RB:[220,220]};
  let s=`<svg viewBox="0 0 300 320" role="img" aria-label="底盤俯視圖"><text x="150" y="22" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="var(--body)">▲ 車頭（前）</text>
  <rect x="70" y="40" width="160" height="250" rx="10" fill="#2a2f3a" stroke="var(--muted)" stroke-width="2"/>
  <rect x="128" y="60" width="44" height="14" rx="7" fill="var(--bg)"/><rect x="128" y="256" width="44" height="14" rx="7" fill="var(--bg)"/>`;
  for(const p in C){const [x,y]=C[p];const ok=S.screws[p];
    s+=`<g class="slot" data-screw="${p}" tabindex="0" role="button" aria-label="${POS[p]}馬達固定座">
     <rect x="${x}" y="${y}" width="40" height="50" rx="6" fill="${ok?"var(--ok)":"var(--card)"}" stroke="var(--ink)" stroke-width="2.5" ${ok?"":'stroke-dasharray="5 4"'}/>
     <text x="${x+20}" y="${y+31}" text-anchor="middle" font-size="${ok?20:13}" fill="${ok?"#fff":"var(--muted)"}" font-family="var(--body)">${ok?"✓":"點我"}</text>
     <text x="${x+20}" y="${y+68}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--body)">${POS[p]}</text></g>`;}
  return s+"</svg>";
}

function portsOk(){return ["LF","RF","LB","RB"].every(p=>S.ports[p]===ANS_PORT[p])}

/* ---------- render ---------- */
const stage=document.getElementById("stage");
function render(){
  const st=STEPS[S.step];
  stage.style.setProperty("--c","var(--c"+(S.step%6)+")");
  stage.innerHTML=st.render();
  STEPS.forEach((s,i)=>{S.done["s"+i]=s.ok()});
  document.getElementById("rail").innerHTML=STEPS.map((s,i)=>`<button type="button" class="chip ${i===S.step?"on":""} ${S.done["s"+i]?"done":""}" style="--c:var(--c${i%6})" data-go="${i}"><b>${S.done["s"+i]&&i!==S.step?"✓":i}</b>${s.t}</button>`).join("");
  const n=STEPS.filter((s,i)=>S.done["s"+i]).length;
  document.getElementById("barFill").style.width=(n/STEPS.length*100)+"%";
  document.getElementById("progTxt").textContent=n+"/"+STEPS.length;
  document.getElementById("prevBtn").disabled=S.step===0;
  const nb=document.getElementById("nextBtn"),ok=st.ok();
  nb.hidden=S.step===STEPS.length-1;
  nb.disabled=!ok;
  document.getElementById("needTxt").textContent=ok?"":"完成條件：" + st.need;
  nb.textContent=S.step===STEPS.length-2?"完成組裝！":"下一步 →";
  if(S.step===STEPS.length-1&&st.ok()){launchConfetti();const ag=document.getElementById("again");if(ag)ag.onclick=launchConfetti}
  const ci=document.getElementById("certName");
  if(ci)ci.addEventListener("input",e=>{S.name=e.target.value;save()});
  save();
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));pickSel=null;render();
  const r=document.querySelector(".chip.on");if(r)r.scrollIntoView({block:"nearest",inline:"center"});window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("prevBtn").onclick=()=>go(S.step-1);
document.getElementById("nextBtn").onclick=()=>go(S.step+1);
document.getElementById("rail").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(+b.dataset.go)});

stage.addEventListener("change",e=>{const k=e.target.dataset.ck;if(k){S.checks[k]=e.target.checked;
  const st=STEPS[S.step];const sy=window.scrollY;render();window.scrollTo(0,sy)}});
function act(e){
  const t=e.target;
  const sc=t.closest("[data-screw]");
  if(sc){S.screws[sc.dataset.screw]=!S.screws[sc.dataset.screw];return rr()}
  if(S.step===5){
    const w=t.closest("[data-w]");
    if(w){const p=w.dataset.w;const cur=S.wheels[p];S.wheels[p]=cur===null?"A":cur==="A"?"B":null;S.done.wheel=false;return rr()}
    if(t.id==="resetWheels"){S.wheels={LF:null,RF:null,LB:null,RB:null};S.done.wheel=false;return rr()}
    if(t.id==="checkWheels"){
      const m=document.getElementById("wheelMsg");
      if(Object.values(S.wheels).some(v=>!v)){m.className="msg bad";m.textContent="還有輪子沒放喔！";return}
      const wrong=Object.keys(ANS_WHEEL).filter(p=>S.wheels[p]!==ANS_WHEEL[p]);
      if(!wrong.length){S.done.wheel=true;return rr()}
      const front=S.wheels.LF===ANS_WHEEL.LF&&S.wheels.RF===ANS_WHEEL.RF;
      m.className="msg bad";m.textContent=front?"前面是 V 了，後面還沒拼成「八」，再看看斜線方向":"前面兩顆的斜線還沒拼成 V，試試看交換 A 和 B";return}
  }
  if(S.step===6){
    const pk=t.closest("[data-pick]")||t.closest("[data-w]");
    if(pk){const p=pk.dataset.pick||pk.dataset.w;pickSel=pickSel===p?null:p;return rr()}
    const pt=t.closest("[data-port]");
    if(pt){
      if(!pickSel){const m=stage.querySelector(".msg");if(m){m.className="msg bad";m.textContent="先點一顆馬達，再點接口"}return}
      const m=pt.dataset.port;
      for(const k in S.ports)if(S.ports[k]===m)delete S.ports[k];
      S.ports[pickSel]=m;pickSel=null;return rr()}
  }
  const q=t.closest("[data-q]");
  if(q){S.quiz[+q.dataset.q]=+q.dataset.a;return rr()}
}
function launchConfetti(){
  const cv=document.getElementById("confetti");if(!cv)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=cv.parentElement.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
  cv.width=box.width*dpr;cv.height=box.height*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=["--c0","--c1","--c2","--c3","--c4","--c5"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:160},()=>({x:box.width/2+(Math.random()-.5)*80,y:box.height*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,col:cols[Math.floor(Math.random()*6)]}));
  let f=0;cancelAnimationFrame(window.__cf);
  (function tick(){c.clearRect(0,0,box.width,box.height);
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
    if(++f<220)window.__cf=requestAnimationFrame(tick);else c.clearRect(0,0,box.width,box.height)})();
}
function rr(){const sy=window.scrollY;render();window.scrollTo(0,sy)}
stage.addEventListener("click",act);
stage.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"]')){e.preventDefault();act(e)}});
render();
</script>
