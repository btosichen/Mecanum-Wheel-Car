<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麥克納姆輪小車挑戰賽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: sticker-book quiz — score/timer dock on top, one big question card, chunky answer buttons for tablets */
:root{
  --bg:#e6f4ff; --dot:#c4e3ff; --card:#ffffff; --ink:#1d1a4d; --muted:#57527f; --line:#1d1a4d; --soft:#f3f0ff;
  --yellow:#ffd23f; --wa:#b8f2d0; --wa-ink:#0b7a43; --wb:#ffcbe6; --wb-ink:#b3186c;
  --blue:#2f7bff; --ok:#14a35b; --bad:#ff3b5c;
  --c0:#ff7a1a; --c1:#2f7bff; --c2:#14b86a; --c3:#ff4fa3; --c4:#8b5cf6; --c5:#ffb800;
  --shadow:4px 4px 0 var(--line);
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:56px;height:56px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;flex:none;border:3px solid var(--line);box-shadow:var(--shadow);transform:rotate(-6deg)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 2px}
.sub{color:var(--muted);font-size:15px;margin:0}
.dock{display:flex;gap:10px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow);min-width:118px}
.stat .lab{font-size:13px;color:var(--muted);line-height:1.2}
.stat .val{font-family:var(--mono);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:13px}
.dot.now{background:var(--yellow);transform:scale(1.12)}
.dot.r{background:var(--ok);color:#fff}
.dot.w{background:var(--bad);color:#fff}
.card{--c:var(--c1);background:var(--card);border-radius:24px;padding:clamp(18px,3.5vw,34px);border:3px solid var(--line);box-shadow:7px 7px 0 var(--c);display:flex;flex-direction:column;gap:18px}
.eyebrow{align-self:flex-start;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.08em;color:#fff;background:var(--c);border:2px solid var(--line);border-radius:10px;padding:3px 12px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--line)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(23px,4.4vw,32px);margin:0;line-height:1.35;text-wrap:balance}
p{margin:0;max-width:62ch}
.qbody{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.qbody>*{min-width:0}
@media (max-width:640px){.qbody{grid-template-columns:1fr}}
.fig{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:8px;width:200px;justify-self:center}
.fig svg{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-family:var(--body);font-size:18px;font-weight:500;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 14px;min-height:64px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.opt:hover:not(:disabled){transform:translate(-1px,-2px);box-shadow:5px 6px 0 var(--line)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.opt .k{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;color:#fff;background:var(--c);border:2px solid var(--line)}
.opt:disabled{cursor:default}
.opt.right{background:var(--wa);color:var(--wa-ink)}
.opt.right .k{background:var(--ok)}
.opt.wrong{background:#ffe0e5;color:#8a0f26}
.opt.wrong .k{background:var(--bad)}
.opt.dim{opacity:.5}
.fb{border-radius:18px;padding:14px 18px;border:3px solid var(--line);display:flex;flex-direction:column;gap:6px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.fb.ok{background:#dcfbe9}
.fb.no{background:#fff0f2}
.fb .head{font-family:var(--display);font-size:24px}
.fb.ok .head{color:var(--ok)} .fb.no .head{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:20px;border-radius:16px;padding:12px 28px;cursor:pointer;min-height:58px;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.go{background:var(--yellow)}
.btn.big{font-size:26px;padding:14px 40px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.rules{grid-template-columns:1fr}}
.rule{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.rule b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--c)}
.best{font-size:15px;color:var(--muted)}
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;position:relative}
.result canvas{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);pointer-events:none}
.medal{animation:bounce 1.6s ease-in-out infinite}
.bigscore{font-family:var(--mono);font-weight:800;font-size:clamp(56px,13vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:.35em;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--c);color:#fff;font-weight:700;border:3px solid var(--line);border-radius:99px;padding:6px 16px;box-shadow:3px 3px 0 var(--line);font-size:16px}
.newbest{background:var(--yellow);color:var(--ink)}
.review{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.rv{background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rv .ans{color:var(--ok);font-weight:700}
.rv .mine{color:var(--bad)}
.foot{color:var(--muted);font-size:13px;text-align:center}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

[hidden]{display:none!important} img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 30 30"><rect x="6" y="4" width="18" height="22" rx="4" fill="none" stroke="#1d1a4d" stroke-width="2.4"/><rect x="1" y="5" width="5" height="8" rx="1.5" fill="#1d1a4d"/><rect x="24" y="5" width="5" height="8" rx="1.5" fill="#1d1a4d"/><rect x="1" y="17" width="5" height="8" rx="1.5" fill="#1d1a4d"/><rect x="24" y="17" width="5" height="8" rx="1.5" fill="#1d1a4d"/><text x="15" y="19" text-anchor="middle" font-size="11" font-weight="800" fill="#1d1a4d" font-family="sans-serif">?</text></svg>
      </div>
      <div style="min-width:0">
        <h1>麥克納姆輪小車<span class="hl">挑戰賽</span></h1>
        <p class="sub">10 題選擇題｜看你多快、多準！</p>
      </div>
    </div>
    <div class="dock">
      <div class="stat"><span class="ic" style="background:var(--c5)" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1l2.1 4.4 4.9.6-3.6 3.3 1 4.8L8 11.8 3.6 14.1l1-4.8L1 6l4.9-.6z" fill="#1d1a4d"/></svg></span><span><span class="lab">分數</span><br><span class="val" id="score">0</span></span></div>
      <div class="stat"><span class="ic" style="background:var(--c1)" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="9" r="6" fill="#fff" stroke="#1d1a4d" stroke-width="2"/><path d="M8 9V5.5M6 1h4" stroke="#1d1a4d" stroke-width="2" stroke-linecap="round"/></svg></span><span><span class="lab">時間</span><br><span class="val" id="timer">00:00</span></span></div>
    </div>
  </header>

  <div class="dots" id="dots" aria-label="題目進度"></div>
  <main class="card" id="card" aria-live="polite"></main>
  <p class="foot">臺北市立陽明高中｜micro:bit 麥克納姆輪小車課程・功能練習題</p>
</div>

<script>
const Q=[
 {q:"依照課程內容，麥克納姆輪小車一共可以往幾種方向移動？",o:["4 種","6 種","8 種","10 種"],a:3,e:"前進、後退、左平移、右平移、4 個斜角、向左旋轉、向右旋轉，共 10 種。",fig:"all"},
 {q:"下面哪一個動作，一般輪子的小車做不到，麥克納姆輪小車做得到？",o:["前進","後退","原地轉圈","車頭不轉，直接往右橫著走"],a:3,e:"一般小車要轉彎才能換方向，麥克納姆輪可以直接橫著平移。",fig:"strafe"},
 {q:"麥克納姆輪能橫著走，靠的是輪子上的什麼構造？",o:["比較粗的輪胎紋路","一圈斜放的小滾輪","比較大的輪子","輪子裡的彈簧"],a:1,e:"小滾輪斜著放，輪子轉動時會產生斜向的推力，四顆輪子的推力合起來，小車就能往不同方向走。",fig:"wheel"},
 {q:"輪子上的小滾輪，大約跟輪軸斜了幾度？",o:["15 度","30 度","45 度","90 度"],a:2,e:"麥克納姆輪的小滾輪大約斜 45 度，所以推力會一半往前後、一半往左右。",fig:"angle"},
 {q:"小車要「前進」時，四顆輪子應該怎麼轉？",o:["四顆都正轉","左邊正轉、右邊反轉","只有前面兩顆轉","對角線兩顆轉"],a:0,e:"四顆輪子一起往前推，左右的推力互相抵消，小車就直直往前走。",fig:"fwd"},
 {q:"小車要「原地向右旋轉」時，輪子應該怎麼轉？",o:["四顆都正轉","左邊兩顆正轉、右邊兩顆反轉","左邊兩顆反轉、右邊兩顆正轉","四顆都停止"],a:1,e:"左邊往前推、右邊往後拉，車身就會順時針轉。",fig:"rot"},
 {q:"小車「向右平移」時，哪兩顆輪子的轉動方向相同？",o:["左前和右前","左前和左後","左前和右後（對角線）","四顆都相同"],a:2,e:"平移時對角線上的兩顆輪子轉向一樣，而前面兩顆的轉向相反。",fig:"car"},
 {q:"小車「斜角移動」（例如往右上方走）時，有幾顆輪子在轉？",o:["1 顆","2 顆","3 顆","4 顆"],a:1,e:"只有對角線上的兩顆輪子轉動，另外兩顆停止。",fig:"diag"},
 {q:"如果 A 輪和 B 輪裝錯位置，最可能發生什麼事？",o:["小車完全不能動","前進後退大致正常，但平移、斜走會亂掉或走不出來","小車會跑得更快","micro:bit 會壞掉"],a:1,e:"所以組裝時一定要記住「上 V 下八」。",fig:"car"},
 {q:"寫程式時，想讓「左後輪」轉動，要控制哪一個馬達接口？",o:["M1","M2","M3","M4"],a:1,e:"左前 M1、左後 M2、右前 M3、右後 M4。",fig:"ports"}
];
const COLORS=["--c0","--c1","--c2","--c3","--c4","--c5"];
let st={phase:"intro",i:0,score:0,ans:[],order:[],t0:0,elapsed:0,locked:false};
let tick=null;
const $=id=>document.getElementById(id);
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function getBest(){try{return JSON.parse(localStorage.getItem("mecanum-quiz-best")||"null")}catch(e){return null}}
function setBest(b){try{localStorage.setItem("mecanum-quiz-best",JSON.stringify(b))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- figures ---------- */
function rollers(x,y,w,h,t,id){let s=`<clipPath id="k${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/></clipPath><g clip-path="url(#k${id})" stroke="#1d1a4d" stroke-width="2.5" opacity=".7">`;
  for(let k=-w;k<h+w;k+=14){s+=t==="A"?`<line x1="${x}" y1="${y+k+w}" x2="${x+w}" y2="${y+k}"/>`:`<line x1="${x}" y1="${y+k}" x2="${x+w}" y2="${y+k+w}"/>`}return s+"</g>"}
function arrow(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),L=12;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="6" stroke-linecap="round"/><path d="M${x2} ${y2} L${x2-L*Math.cos(a-.5)} ${y2-L*Math.sin(a-.5)} L${x2-L*Math.cos(a+.5)} ${y2-L*Math.sin(a+.5)}Z" fill="${col}" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`}
const W={LF:[14,30,"B","左前","M1"],RF:[156,30,"A","右前","M3"],LB:[14,140,"A","左後","M2"],RB:[156,140,"B","右後","M4"]};
function car(extra,opt={}){
  let s=`<svg viewBox="0 0 200 230" role="img" aria-label="小車俯視圖"><text x="100" y="16" text-anchor="middle" font-size="12" fill="#57527f" font-family="var(--body)">▲ 車頭</text>
  <rect x="44" y="26" width="112" height="180" rx="40" fill="#ffd23f" fill-opacity=".4" stroke="#1d1a4d" stroke-width="3"/>`;
  for(const p in W){const [x,y,t,n,m]=W[p];const off=opt.off&&opt.off.includes(p);
    s+=`<g opacity="${off?.3:1}"><rect x="${x}" y="${y}" width="30" height="60" rx="7" fill="${t==="A"?"#b8f2d0":"#ffcbe6"}" stroke="#1d1a4d" stroke-width="2.5"/>${rollers(x,y,30,60,t,p+Math.random().toString(36).slice(2,6))}</g>
    <text x="${x+15}" y="${y+76}" text-anchor="middle" font-size="12" fill="#1d1a4d" font-family="var(--body)">${opt.ports?m:n}</text>`}
  return s+(extra||"")+"</svg>"}
function figure(k){
  const O="#ff7a1a",B="#2f7bff";
  if(k==="all"){let s="";const c=[100,116];[[0,-1],[0,1],[-1,0],[1,0],[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]].forEach(([dx,dy])=>{s+=arrow(c[0]+dx*16,c[1]+dy*16,c[0]+dx*42,c[1]+dy*42,O)});
    s+=`<path d="M78 116 A22 22 0 0 1 100 94" fill="none" stroke="${B}" stroke-width="4"/><path d="M122 116 A22 22 0 0 1 100 138" fill="none" stroke="${B}" stroke-width="4"/>`;return car(s)}
  if(k==="strafe")return car(arrow(70,116,132,116,O));
  if(k==="fwd")return car(arrow(100,150,100,72,O));
  if(k==="rot")return car(`<path d="M100 76 A40 40 0 1 1 62 104" fill="none" stroke="${O}" stroke-width="6" stroke-linecap="round"/>`+arrow(60,114,66,98,O));
  if(k==="diag")return car(arrow(76,146,126,90,O),{off:["RF","LB"]});
  if(k==="ports")return car("",{ports:true});
  if(k==="car")return car("");
  if(k==="wheel"||k==="angle"){
    let s=`<svg viewBox="0 0 200 200" role="img" aria-label="麥克納姆輪示意圖"><rect x="40" y="20" width="120" height="160" rx="22" fill="#2f7bff" stroke="#1d1a4d" stroke-width="3"/>`;
    for(let i=0;i<5;i++){const y=34+i*28;s+=`<rect x="58" y="${y}" width="84" height="18" rx="9" fill="#1d1a4d" transform="rotate(-45 100 ${y+9})"/>`}
    s+=`<line x1="10" y1="100" x2="190" y2="100" stroke="#ff7a1a" stroke-width="4" stroke-dasharray="8 6"/>`;
    if(k==="angle")s+=`<rect x="128" y="4" width="66" height="28" rx="8" fill="#ffd23f" stroke="#1d1a4d" stroke-width="2.5"/><text x="161" y="24" text-anchor="middle" font-size="17" font-weight="800" fill="#1d1a4d" font-family="var(--mono)">?°</text>`;
    s+=`<text x="100" y="196" text-anchor="middle" font-size="12" fill="#1d1a4d" font-family="var(--body)">橘色虛線＝輪軸方向</text>`;
    return s+"</svg>"}
  return ""}

/* ---------- screens ---------- */
function setColor(i){$("card").style.setProperty("--c","var("+COLORS[i%6]+")")}
function dots(){$("dots").innerHTML=Q.map((_,i)=>{const a=st.ans[i];const c=a==null?(st.phase==="q"&&i===st.i?"now":""):(a.ok?"r":"w");return `<span class="dot ${c}">${a==null?i+1:(a.ok?"✓":"✗")}</span>`}).join("")}
function stats(){$("score").textContent=st.score;$("timer").textContent=fmt(st.elapsed)}

function intro(){
  setColor(1);st.phase="intro";dots();stats();const b=getBest();
  $("card").innerHTML=`<span class="eyebrow">準備好了嗎？</span>
  <h2>考考你：麥克納姆輪小車會怎麼動？</h2>
  <p>你已經把小車組好了，現在來看看你懂不懂它的超能力！一共 10 題，按下開始就會計時。</p>
  <div class="rules">
   <div class="rule" style="--c:var(--c2)"><b>每題 10 分</b>滿分 100 分</div>
   <div class="rule" style="--c:var(--c1)"><b>計時挑戰</b>答完最後一題停止</div>
   <div class="rule" style="--c:var(--c3)"><b>馬上看解說</b>答錯也能學到</div>
  </div>
  <div class="row"><span class="best">${b?`你的最佳紀錄：<b>${b.score} 分</b>・${fmt(b.time)}`:"還沒有紀錄，來創造第一筆吧！"}</span>
  <button class="btn go big" id="start" type="button">開始挑戰 →</button></div>`;
  $("start").onclick=start;$("start").focus();
}
function start(){
  st={phase:"q",i:0,score:0,ans:[],order:Q.map(q=>shuffle(q.o.map((_,j)=>j))),t0:performance.now(),elapsed:0,locked:false};
  clearInterval(tick);tick=setInterval(()=>{st.elapsed=performance.now()-st.t0;stats()},250);
  question();
}
function question(){
  const q=Q[st.i],ord=st.order[st.i];setColor(st.i);st.locked=false;dots();stats();
  $("card").innerHTML=`<span class="eyebrow">第 ${st.i+1} 題 / ${Q.length}</span>
  <div class="qbody"><h2>${q.q}</h2>${q.fig?`<div class="fig">${figure(q.fig)}</div>`:""}</div>
  <div class="opts">${ord.map((j,n)=>`<button class="opt" type="button" data-j="${j}"><span class="k">${"ABCD"[n]}</span><span>${q.o[j]}</span></button>`).join("")}</div>
  <div id="fbBox"></div>`;
  $("card").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j,b));
  window.scrollTo({top:0,behavior:"smooth"});
}
function answer(j,btn){
  if(st.locked)return;st.locked=true;
  const q=Q[st.i],ok=j===q.a;
  st.ans[st.i]={pick:j,ok};if(ok)st.score+=10;
  const last=st.i===Q.length-1;
  if(last){clearInterval(tick);st.elapsed=performance.now()-st.t0}
  stats();dots();
  $("card").querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.j;b.disabled=true;
    if(k===q.a)b.classList.add("right");else if(k===j)b.classList.add("wrong");else b.classList.add("dim")});
  if(!ok)btn.classList.add("shake");
  $("fbBox").innerHTML=`<div class="fb ${ok?"ok":"no"}"><span class="head">${ok?"答對了！+10 分":"差一點！"}</span>
   ${ok?"":`<span>正確答案是：<b>${q.o[q.a]}</b></span>`}<span>${q.e}</span></div>
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn go" id="next" type="button">${last?"看成績 →":"下一題 →"}</button></div>`;
  $("next").onclick=()=>{if(last)result();else{st.i++;question()}};
  $("next").focus({preventScroll:true});
}
function result(){
  st.phase="done";setColor(4);dots();stats();
  const b=getBest();const isBest=!b||st.score>b.score||(st.score===b.score&&st.elapsed<b.time);
  if(isBest)setBest({score:st.score,time:st.elapsed});
  const right=st.ans.filter(a=>a.ok).length;
  const msg=st.score===100?"滿分！你是麥克納姆輪專家！":st.score>=80?"很厲害！只差一點點就滿分":st.score>=60?"及格了！看看解說再挑戰一次":"多看幾次解說，再試一次一定會進步";
  const medalCol=st.score===100?"#ffd23f":st.score>=80?"#cfd8e6":st.score>=60?"#f0a868":"#b8f2d0";
  const wrong=Q.map((q,i)=>({q,i,a:st.ans[i]})).filter(x=>!x.a.ok);
  $("card").innerHTML=`<div class="result"><canvas id="cf" aria-hidden="true"></canvas>
   <span class="eyebrow" style="align-self:center">挑戰完成</span>
   <svg class="medal" viewBox="0 0 120 120" width="110" height="110" aria-hidden="true"><path d="M38 6h18l8 30H46zM64 6h18l-8 30H56z" fill="#ff4fa3" stroke="#1d1a4d" stroke-width="3"/><circle cx="60" cy="72" r="40" fill="${medalCol}" stroke="#1d1a4d" stroke-width="4"/><circle cx="60" cy="72" r="28" fill="none" stroke="#1d1a4d" stroke-width="3" stroke-dasharray="4 5"/><text x="60" y="80" text-anchor="middle" font-size="21" font-weight="800" fill="#1d1a4d" font-family="var(--mono)">${right}/10</text></svg>
   <div class="bigscore">${st.score}<small> 分</small></div>
   <h2>${msg}</h2>
   <div class="chips">
    <span class="chip" style="--c:var(--c1)">用時 ${fmt(st.elapsed)}</span>
    <span class="chip" style="--c:var(--c2)">答對 ${right} 題</span>
    ${isBest?`<span class="chip newbest">新的最佳紀錄！</span>`:`<span class="chip" style="--c:var(--c4)">最佳 ${b.score} 分・${fmt(b.time)}</span>`}
   </div>
   ${wrong.length?`<div class="review"><b style="font-family:var(--display);font-weight:400;font-size:22px">再複習一下答錯的題目</b>${wrong.map(x=>`<div class="rv"><b>第 ${x.i+1} 題：${x.q.q}</b><span class="mine">你選：${x.q.o[x.a.pick]}</span><span class="ans">正確：${x.q.o[x.q.a]}</span><span>${x.q.e}</span></div>`).join("")}</div>`:""}
   <div class="row" style="justify-content:center"><button class="btn" id="home" type="button">回首頁</button><button class="btn go big" id="again" type="button">再挑戰一次</button></div>
  </div>`;
  $("again").onclick=start;$("home").onclick=intro;
  window.scrollTo({top:0,behavior:"smooth"});
  if(st.score>=60)confetti();
}
function confetti(){
  const cv=$("cf");if(!cv)return;if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=box.width*dpr;cv.height=box.height*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);const cols=["#ff7a1a","#2f7bff","#14b86a","#ff4fa3","#8b5cf6","#ffb800"];
  const P=Array.from({length:150},()=>({x:box.width/2+(Math.random()-.5)*60,y:box.height*.25,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*3,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,col:cols[Math.floor(Math.random()*6)]}));
  let f=0;(function t(){c.clearRect(0,0,box.width,box.height);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});if(++f<200)requestAnimationFrame(t);else c.clearRect(0,0,box.width,box.height)})();
}
document.addEventListener("keydown",e=>{if(st.phase!=="q"||st.locked)return;const n="1234abcd".indexOf(e.key.toLowerCase());if(n<0)return;const b=$("card").querySelectorAll(".opt")[n%4];if(b)b.click()});
intro();
</script>
